# =============================================================================
# Models Configuration v5.2 — Google Flash + Ollama Local
# =============================================================================

defaults:
  provider: google          # ← переключено на Google Flash
  strategy: balanced
  enable_fallback: true     # при ошибке Google → Ollama автоматически


# =============================================================================
# Google Gemini Flash (основной, бесплатно через AI Studio)
# Ключ: https://aistudio.google.com/apikey → в .env как GEMINI_API_KEY
# =============================================================================

google:
  pro_model:   "gemini-2.5-flash"   # тяжёлые агенты
  flash_model: "gemini-2.5-flash"                # основная
  lite_model:  "gemini-2.5-flash"           # классификаторы

  max_tokens:     8192
  context_length: 1048576    # 1M токенов

  image_model: "gemini-2.0-flash-preview-image-generation"


# =============================================================================
# Ollama (локальный, fallback при недоступности Google)
# =============================================================================

ollama:
  model: qwen2.5:14b-instruct-q5_k_m
  base_url: http://host.docker.internal:11434   # ← Ollama в WSL, минуя Docker
  context_length: 32768

# Per-agent модели Ollama (раскомментируй при локальной работе)
# agent_models:
#   rewriter: glm-4.7-flash:q4_K_M
#   style_normalizer: glm-4.7-flash:q4_K_M
#   telegram_formatter: glm-4.7-flash:q4_K_M


# =============================================================================
# Температуры (общие для всех провайдеров)
# =============================================================================

temperatures:
  classifier:          0.1
  relevance:           0.3
  quality_validator:   0.1
  summarizer:          0.5
  rewriter:            0.7
  style_normalizer:    0.3
  telegram_formatter:  0.5
  telegraph_formatter: 0.5
  image_prompt:        0.8
  cat_commentator:     0.9
  seo_optimizer:       0.4


# =============================================================================
# Pipeline
# =============================================================================

pipeline:
  limit: 10
  min_relevance: 5
  min_publish_score: 7
  max_retries: 3
  publish_telegraph: true
  publish_telegram: false


# =============================================================================
# Telegraph
# =============================================================================

telegraph:
  paragraphs_per_image: 3
  max_content_length: 64000


# =============================================================================
# Retry
# =============================================================================

retry:
  max_retries: 3
  retry_delay: 1.0
  exponential_backoff: true


# =============================================================================
# Timeout
# =============================================================================

timeout:
  default: 30
  classification: 10
  summarization: 60
  normalization: 120